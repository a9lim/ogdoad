name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -p ogdoad --check

  clippy:
    # Lint the published core and, separately, its optional Python surface.
    # The unpublished grundy language is an opt-in sidecar rather than a core
    # CI gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p ogdoad --all-targets -- -D warnings
      - run: cargo clippy -p ogdoad --features python --all-targets -- -D warnings

  test:
    # The math core is pure Rust and the source of truth (AGENTS.md): no Python
    # in the loop. Run it on both platforms ogdoad is developed on. The property
    # suites (scalar_axioms / clifford_axioms) fuzz the ring + geometric-product
    # axioms here too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ogdoad

  doc:
    # Rustdoc must run COLD with -D warnings. An incremental `cargo doc` only
    # re-checks what it recompiles, so it silently under-reports stale intra-doc
    # links in untouched modules (AGENTS.md). A fresh checkout is cold by
    # construction.
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps -p ogdoad

  python:
    # Build the sdist and reconstruct the abi3 wheel from it, then install the
    # wheel and run the demo tour. This keeps the source package honest as well
    # as exercising Display paths (blade / nimber / surreal rendering) that do
    # not surface in `cargo test`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Build the sdist and abi3 wheel from it
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --sdist --out dist
          sccache: true
          manylinux: auto
      - name: Install the wheel and run the demo tour
        run: |
          pip install --find-links dist --no-index ogdoad
          python demo.py
      - name: Check the installed typing payload
        run: |
          python - <<'PY'
          from pathlib import Path

          import ogdoad

          package = Path(ogdoad.__file__).parent
          missing = [
              name
              for name in ("__init__.pyi", "py.typed")
              if not (package / name).is_file()
          ]
          if missing:
              raise SystemExit(f"wheel is missing typing files: {', '.join(missing)}")
          PY
      - name: Check the committed type stubs are up to date
        # ogdoad.pyi is @generated from the built module by scripts/generate_stubs.py.
        # If a binding was added/renamed without regenerating, the committed stub is
        # stale — fail here rather than ship a wrong .pyi. The generator output is
        # fully sorted, so it is byte-stable across Python versions.
        run: python scripts/generate_stubs.py --check
